# Application
spring.application.name=agenthub-skill-runtime
server.port=8082

# Logging
logging.level.root=INFO
logging.level.dev.cezar.agenthub.skillruntime=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Jackson
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# R2DBC PostgreSQL (for tool execution logging + document search)
spring.r2dbc.url=r2dbc:postgresql://postgres.internal:5432/agenthub
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# Actuator (Health checks + Metrics)
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Backend URL (for skill resolution)
agenthub.backend.url=http://agenthub-backend:8080

# MCP Client URL (for MCP tool execution)
agenthub.mcp.client.url=http://agenthub-mcp-client:9001

# Tool Execution Defaults
agenthub.tools.default-timeout-ms=30000
agenthub.tools.max-retry-attempts=3
agenthub.tools.retry-backoff-ms=1000
