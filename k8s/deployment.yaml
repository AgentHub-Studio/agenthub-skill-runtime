---
# agenthub-skill-runtime — Go (replaces Java Spring WebFlux version)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-skill-runtime
  namespace: agenthub
  labels:
    app: agenthub-skill-runtime
    version: go
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-skill-runtime
  template:
    metadata:
      labels:
        app: agenthub-skill-runtime
        version: go
    spec:
      containers:
        - name: skill-runtime
          image: localhost:5000/agenthub-skill-runtime:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agenthub-skill-runtime-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: RABBITMQ_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-skill-runtime
  namespace: agenthub
  labels:
    app: agenthub-skill-runtime
spec:
  selector:
    app: agenthub-skill-runtime
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
