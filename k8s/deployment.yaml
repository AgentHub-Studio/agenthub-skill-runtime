---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agenthub-skill-runtime
  namespace: agenthub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agenthub-skill-runtime
  template:
    metadata:
      labels:
        app: agenthub-skill-runtime
    spec:
      containers:
        - name: skill-runtime
          image: localhost:5000/agenthub-skill-runtime:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: database-url
            - name: KEYCLOAK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: agenthub-config
                  key: keycloak-url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: agenthub-secrets
                  key: rabbitmq-url
                  optional: true
            - name: LOG_LEVEL
              value: info
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agenthub-skill-runtime
  namespace: agenthub
spec:
  selector:
    app: agenthub-skill-runtime
  ports:
    - port: 8083
      targetPort: 8083
